[project]
name = "devswarm"
version = "0.1.0"
description = "Autonomous multi-agent software engineer: GitHub issue in, tested pull request out."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "gitpython>=3.2.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.28.0",
]

[project.scripts]
devswarm = "devswarm.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devswarm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests are plain functions. These stop names like TesterAgent and tester_finish being collected.
python_functions = ["test_*"]
python_classes = ["Test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
